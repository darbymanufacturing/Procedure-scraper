[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procedure-scraper"
version = "0.1.0"
description = "Search the internet for legitimate car repair manuals and return download / access links"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.scripts]
repair-manual = "scraper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*"]
